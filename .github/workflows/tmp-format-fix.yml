name: tmp format fix (remove before merge)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/layer-groups
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.13.0
      - name: Apply dart format to the core package
        run: dart format packages/ggen_core/lib packages/ggen_core/test
      - name: Commit and push the formatted result
        run: |
          git config user.name "ggen-format-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "no formatting changes"
          else
            git diff --cached --stat
            git diff --cached
            git commit -m "style: apply dart format to core package (auto)"
            git push origin HEAD:feat/layer-groups
          fi
