name: Repo Knowledge Sync

# Rollout of soobujmiah/skb's governance/DETERMINISTIC_STATE_SYNC_POLICY.md to this repository
# (DEC-2026-09-25-002). tools/repo_knowledge/ and schemas/*.schema.json are vendored copies from
# soobujmiah/skb -- see tools/repo_knowledge/README.md. Do not hand-edit .repo/; it is
# regenerated by this workflow.
#
# Two jobs, matching the pattern established on skb itself:
#   - test: runs tools/repo_knowledge's own unit tests (guards the vendored copy). Allowed to fail.
#   - sync: ALWAYS runs (even if `test` failed, or if the build/test checks below fail -- policy
#     rule 4/7: a failed check must still be recorded, not silently dropped). It independently
#     runs this repository's own build/test checks (dart analyze + dart test for ggen_core,
#     flutter test for ggen_app) to produce build.status/test.status, then syncs and commits
#     .repo/ back to main. paths-ignore on the push trigger stops that commit from re-triggering
#     this same workflow.
#
# Known limitation: dart_analyze feeds build.status; the core+app test suites are combined into
# one test.status (passed only if both pass) because the .repo/project.yaml schema carries one
# test result, not one per package. This does not duplicate the public-governance.yml security/
# provenance/SBOM scans, which stay in their own workflow.

on:
  push:
    branches: [main]
    paths-ignore:
      - '.repo/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: python -m pip install --quiet -r requirements-governance.txt

      - name: Run tools/repo_knowledge tests
        run: python3 -m unittest discover -s tools/repo_knowledge/tests -p 'test_*.py' -v

  sync:
    needs: test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Python dependencies
        run: python -m pip install --quiet -r requirements-governance.txt

      - name: Set up Dart (exact pin, per config/toolchain.yaml)
        uses: dart-lang/setup-dart@v1
        with:
          sdk: "3.13.0"

      - name: dart analyze (build signal)
        id: build
        continue-on-error: true
        working-directory: packages/ggen_core
        run: |
          dart pub get --enforce-lockfile
          dart analyze --fatal-infos

      - name: dart test (ggen_core)
        id: core_tests
        continue-on-error: true
        working-directory: packages/ggen_core
        run: dart test --reporter expanded

      - name: Set up Flutter (exact pin, per config/toolchain.yaml)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: false

      - name: flutter test (ggen_app)
        id: app_tests
        continue-on-error: true
        working-directory: apps/ggen_app
        run: flutter test

      - name: Run tools/repo_knowledge tests (guard the vendored copy)
        id: tool_tests
        continue-on-error: true
        run: python3 -m unittest discover -s tools/repo_knowledge/tests -p 'test_*.py'

      - name: Collect and sync deterministic state
        if: always()
        run: |
          build_status="${{ steps.build.outcome == 'success' && 'passed' || 'failed' }}"
          if [ "${{ steps.core_tests.outcome }}" = "success" ] && [ "${{ steps.app_tests.outcome }}" = "success" ]; then
            test_status="passed"
          else
            test_status="failed"
          fi
          python3 -m tools.repo_knowledge sync --ci \
            --build-status "$build_status" --build-run-id "${{ github.run_id }}" \
            --test-status "$test_status" \
            --test-summary "core: dart test (${{ steps.core_tests.outcome }}), app: flutter test (${{ steps.app_tests.outcome }})"

      - name: Verify .repo/ against schemas
        if: always()
        run: python3 -m tools.repo_knowledge verify

      - name: Commit updated .repo/ state
        if: always() && github.event_name == 'push'
        run: |
          set -euo pipefail
          if git diff --quiet -- .repo; then
            echo "no .repo/ change to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .repo
          git commit -m "chore(repo-knowledge): sync deterministic state for ${{ github.sha }}"
          git push origin HEAD:${{ github.ref_name }}
