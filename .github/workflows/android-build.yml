name: Android debug build (manual mobile test)

on:
  workflow_dispatch:
    inputs:
      reason:
        description: "Why is a mobile APK needed?"
        required: true
        default: "Physical-device validation"
      device:
        description: "Target device"
        required: true
        default: "Redmi Turbo 4 Pro"

env:
  FLUTTER_VERSION: '3.47.0'
  APP_VERSION_BASE: '0.1.0'

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: false
      
      - name: Generate temporary Android wrapper
        working-directory: apps/ggen_app
        run: flutter create --platforms=android --project-name=ggen_app .
      
      - name: Patch debug intent interface
        run: python3 scripts/patch_debug_interface.py apps/ggen_app/android
      
      - name: Set Android app identity to ggen
        run: python3 scripts/prepare_android_identity.py apps/ggen_app/android
      
      - name: Apply version with build identifier
        run: |
          # Use run number as unique build identifier
          BUILD_ID=${{ github.run_number }}
          VERSION="${{ env.APP_VERSION_BASE }}+${BUILD_ID}"
          sed -i "s/^version: .*/version: $VERSION/" apps/ggen_app/pubspec.yaml
          echo "Version: $VERSION"
          cat apps/ggen_app/pubspec.yaml | grep "^version:"
      
      - name: Build debug APK
        working-directory: apps/ggen_app
        run: flutter build apk --debug
      
      - name: Record build metadata
        run: |
          BUILD_ID=${{ github.run_number }}
          VERSION="${{ env.APP_VERSION_BASE }}+${BUILD_ID}"
          echo "## Build Metadata" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Version:** $VERSION" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch:** \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Run ID:** ${{ github.run_id }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Build #:** $BUILD_ID" >> $GITHUB_STEP_SUMMARY
      
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ggen-debug-apk-v${{ github.run_number }}
          path: apps/ggen_app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
