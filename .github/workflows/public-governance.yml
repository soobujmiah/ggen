name: Public governance

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  governance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned governance dependency
        run: python -m pip install --disable-pip-version-check -r requirements-governance.txt
      - name: Validate legal files and public registry
        run: python scripts/check_legal_files.py
      - name: Validate dependency and asset provenance
        run: python scripts/validate_provenance.py
      - name: Check documentation links and secret patterns
        run: python scripts/check_docs.py
      - name: Validate public/private environment contract
        run: python scripts/validate_environment_contract.py
      - name: Verify absent protected-pack state
        run: python scripts/verify_protected_pack.py
      - name: Scan complete Git history for restricted paths, binaries and secrets
        run: python scripts/public_safety_scan.py
      - name: Check release signing and credential serialization policy
        run: python scripts/check_build_security.py
      - name: Print commit and source receipt
        run: python scripts/source_receipt.py
      - name: Run OSV scan when the tool is available
        run: |
          if command -v osv-scanner >/dev/null 2>&1; then
            osv-scanner scan source -r .
          else
            echo "OSV scanner unavailable in this runner image; dependency provenance remains required and the vulnerability scan is recorded as unavailable."
          fi
      - name: Generate SBOM when the tool is available
        run: |
          if command -v syft >/dev/null 2>&1; then
            syft dir:. -o cyclonedx-json=/tmp/ggen-sbom.json
            sha256sum /tmp/ggen-sbom.json
          else
            echo "Syft unavailable in this runner image; SBOM generation is deferred to the pinned build/release environment."
          fi

  core:
    uses: ./.github/workflows/core.yml
