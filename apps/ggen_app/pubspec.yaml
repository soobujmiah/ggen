name: ggen_app
description: Original Android-first GGEN creative and document studio shell.
publish_to: "none"
# Version format: MAJOR.MINOR.PATCH+BUILDCOUNT
# Example: 0.1.0+1 means v0.1.0 build 1
# CI increments BUILD by 1 for each run via environment variable
version: 0.1.0+${{ vars.BUILD_COUNT || '1' }}

environment:
  sdk: ">=3.7.0 <4.0.0"
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.5.3
  crypto: 3.0.7
  path_provider: ^2.1.6
  ggen_core:
    path: ../../packages/ggen_core

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  path_provider_platform_interface: 2.1.3
  plugin_platform_interface: 2.1.8

flutter:
  uses-material-design: true
