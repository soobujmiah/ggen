<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">GGEN creative and document studio architecture</title>
<desc id="desc">Diagram showing GGEN's pure Dart core, Flutter application layer, document and canvas services, persistence, and verification boundaries.</desc>
<defs><linearGradient id="bg" x1="0" x2="1"><stop stop-color="#07140d"/><stop offset="1" stop-color="#0b2115"/></linearGradient><linearGradient id="card" x1="0" x2="1"><stop stop-color="#10291a"/><stop offset="1" stop-color="#0b1d13"/></linearGradient></defs>
<rect width="1200" height="610" rx="28" fill="url(#bg)"/>
<text x="55" y="55" fill="#8ff0ad" font-family="sans-serif" font-size="15" font-weight="700" letter-spacing="3">GGEN · CREATIVE + DOCUMENT STUDIO</text>
<text x="55" y="91" fill="#fff" font-family="sans-serif" font-size="27" font-weight="700">Core contracts → Flutter workspace → deterministic persistence</text>
<g font-family="sans-serif">
<rect x="55" y="145" width="330" height="190" rx="20" fill="url(#card)" stroke="#2c6b43"/><text x="82" y="180" fill="#8ff0ad" font-size="13" font-weight="700">CORE FOUNDATION</text><text x="82" y="216" fill="#fff" font-size="21" font-weight="700">Pure Dart</text><text x="82" y="246" fill="#b8cfc0" font-size="14">stable IDs · document values</text><text x="82" y="271" fill="#b8cfc0" font-size="14">tools · quality gates · jobs</text><text x="82" y="296" fill="#b8cfc0" font-size="14">schema · recovery · serialization</text>
<rect x="435" y="145" width="330" height="190" rx="20" fill="url(#card)" stroke="#2c6b43"/><text x="462" y="180" fill="#8ff0ad" font-size="13" font-weight="700">APPLICATION LAYER</text><text x="462" y="216" fill="#fff" font-size="21" font-weight="700">Flutter workspace</text><text x="462" y="246" fill="#b8cfc0" font-size="14">canvas · text flow · tools</text><text x="462" y="271" fill="#b8cfc0" font-size="14">undo/redo · inspector</text><text x="462" y="296" fill="#b8cfc0" font-size="14">profiles · diagnostics</text>
<rect x="815" y="145" width="330" height="190" rx="20" fill="url(#card)" stroke="#2c6b43"/><text x="842" y="180" fill="#8ff0ad" font-size="13" font-weight="700">DOCUMENT / STORAGE</text><text x="842" y="216" fill="#fff" font-size="21" font-weight="700">Transactional state</text><text x="842" y="246" fill="#b8cfc0" font-size="14">file-backed project storage</text><text x="842" y="271" fill="#b8cfc0" font-size="14">SHA-256 receipts</text><text x="842" y="296" fill="#b8cfc0" font-size="14">recovery journal · restore</text>
<rect x="255" y="410" width="690" height="110" rx="20" fill="#123820" stroke="#67d88c" stroke-width="2"/><text x="285" y="447" fill="#9af4b5" font-size="13" font-weight="700">VERIFICATION LOOP</text><text x="285" y="478" fill="#fff" font-size="20" font-weight="700">Dart tests · Flutter widget/controller tests · physical-device evidence</text><text x="285" y="501" fill="#c4ddcc" font-size="13">implementation ≠ device proof · production release and GPU/NPU claims remain outside the verified boundary</text>
</g>
<g stroke="#69dc8e" stroke-width="3" fill="none"><path d="M385 240h50"/><path d="M765 240h50"/><path d="M600 335v75"/></g>
<text x="55" y="570" fill="#8da897" font-family="sans-serif" font-size="13">Design goal: computer-quality capability with mobile-first interaction, deterministic state and evidence-bounded claims.</text>
</svg>